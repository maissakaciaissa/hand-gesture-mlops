name: Build Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t hand-gesture-api .
    
      - name: Run container
        run: docker run -d -p 8000:8000 --name test-container hand-gesture-api

      - name: Wait for API to be ready
        run: |
          for i in {1..15}; do
            curl -sf http://localhost:8000/ && break
            echo "Waiting for API..."
            sleep 2
          done

      - name: Smoke test /predict endpoint
        run: |
          curl -sf -X POST http://localhost:8000/predict \
            -F "file=@data/frame_09_01_0025.png" \
            | tee response.json
          grep -q "label" response.json

      - name: Stop container
        if: always()
        run: docker stop test-container