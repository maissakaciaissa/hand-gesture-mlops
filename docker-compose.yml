services:
  api:
    build: .
    container_name: hand-gesture-api
    ports:
      - "8000:8000"
    command: uv run uvicorn api.main:app --host 0.0.0.0 --port 8000

  streamlit:
    build: .
    container_name: hand-gesture-ui
    ports:
      - "8501:8501"
    command: uv run streamlit run streamlit_app.py --server.address 0.0.0.0
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000/predict
  
  prometheus:
    image: prom/prometheus:latest
    container_name: hand-gesture-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: hand-gesture-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus